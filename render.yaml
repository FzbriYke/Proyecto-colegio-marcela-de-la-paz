services:
  - type: web
    name: escuela-escritora-marcela-paz
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
